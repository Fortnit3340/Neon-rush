<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⚡ NEON RUSH</title>
<style>
:root{--neon-blue:#00f3ff;--neon-pink:#ff00ff;--neon-purple:#bc13fe;--neon-green:#0aff0a;--neon-yellow:#fefe00;--bg-dark:#0a0a1a;--ui-bg:rgba(10,10,30,0.9);--ui-border:1px solid rgba(0,243,255,0.3)}
*{box-sizing:border-box;user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg-dark);font-family:'Segoe UI',sans-serif;overflow:hidden;color:#fff}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%}
.ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.screen{display:none;width:100%;height:100%;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:absolute;top:0;left:0;pointer-events:none}
.screen.active{display:flex;pointer-events:auto}
.screen-content{background:var(--ui-bg);border:var(--ui-border);border-radius:12px;padding:30px;backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(0,243,255,0.3);max-width:90%;max-height:90%;overflow-y:auto;pointer-events:auto}
h1{font-size:56px;margin:0 0 30px 0;text-shadow:0 0 20px var(--neon-blue),0 0 40px var(--neon-pink);letter-spacing:6px;background:linear-gradient(135deg,var(--neon-blue),var(--neon-pink),var(--neon-purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:32px;margin:15px 0;color:var(--neon-yellow)}
.btn{background:linear-gradient(135deg,var(--neon-purple),var(--neon-blue));border:2px solid var(--neon-blue);color:#fff;padding:14px 28px;font-size:18px;font-weight:bold;border-radius:8px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:2px;margin:8px;min-width:200px}
.btn:hover{transform:scale(1.08);box-shadow:0 0 40px var(--neon-blue)}
.btn:active{transform:scale(0.95)}
.btn-secondary{background:linear-gradient(135deg,#333,#555);border:2px solid #777}
.btn-success{background:linear-gradient(135deg,var(--neon-green),#00cc00);border:2px solid var(--neon-green)}
.btn-danger{background:linear-gradient(135deg,var(--neon-red),#cc0000);border:2px solid var(--neon-red)}
.btn-small{padding:10px 20px;font-size:14px;min-width:150px}
.stat-row{display:flex;justify-content:space-between;width:100%;max-width:400px;margin:10px 0;font-size:16px;padding:8px;background:rgba(0,0,0,0.3);border-radius:6px}
.stat-label{color:var(--neon-blue);font-weight:bold}
.stat-value{color:#fff}
.progress-bar{width:100%;max-width:400px;height:24px;background:#1a1a2e;border-radius:12px;overflow:hidden;margin:12px 0;border:2px solid var(--neon-blue)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink));width:0%;transition:width 0.4s}
.car-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;width:100%;max-width:1000px;max-height:60vh;overflow-y:auto;padding:20px;margin:20px 0}
.car-card{background:linear-gradient(135deg,rgba(0,0,0,0.8),rgba(20,0,40,0.6));border:2px solid var(--neon-purple);border-radius:10px;padding:20px;cursor:pointer;transition:all 0.3s;position:relative}
.car-card:hover{transform:translateY(-5px) scale(1.05);border-color:var(--neon-blue);box-shadow:0 10px 30px rgba(0,243,255,0.4)}
.car-card.selected{border:3px solid var(--neon-green);box-shadow:0 0 30px var(--neon-green)}
.car-card.selected::after{content:'✓ SELECTED';position:absolute;bottom:10px;right:10px;background:var(--neon-green);color:#000;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:bold}
.car-card.locked{opacity:0.5;cursor:not-allowed;filter:grayscale(0.5)}
.car-name{font-size:18px;font-weight:bold;margin-bottom:8px;color:#fff}
.car-class{font-size:12px;opacity:0.7;margin-bottom:10px}
.car-stats{font-size:11px;margin-top:10px;opacity:0.8}
.car-price{margin-top:12px;color:var(--neon-yellow);font-weight:bold;font-size:14px}
.hud-top{position:absolute;top:15px;left:15px;right:15px;display:none;justify-content:space-between;pointer-events:none;z-index:100}
.hud-element{background:var(--ui-bg);border:2px solid var(--neon-blue);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:bold;pointer-events:auto;box-shadow:0 0 15px rgba(0,243,255,0.4)}
.hud-element span{color:var(--neon-yellow)}
.mobile-controls{position:absolute;bottom:30px;left:0;right:0;display:none;justify-content:space-between;padding:0 30px;pointer-events:none;z-index:100}
.mobile-btn{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(0,243,255,0.4),rgba(0,243,255,0.1));border:3px solid var(--neon-blue);pointer-events:auto;display:flex;justify-content:center;align-items:center;font-size:32px;font-weight:bold;box-shadow:0 0 20px rgba(0,243,255,0.5)}
.mobile-btn:active{background:rgba(0,243,255,0.7);transform:scale(0.9)}
.notification{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--neon-green),var(--neon-blue));color:#000;padding:16px 32px;border-radius:8px;font-weight:bold;font-size:18px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:1000}
.notification.show{opacity:1}
.color-picker{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;justify-content:center}
.color-swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;transition:all 0.2s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.selected{border-color:var(--neon-green);transform:scale(1.25);box-shadow:0 0 20px var(--neon-green)}
.upgrade-item{background:rgba(0,0,0,0.5);border:1px solid var(--neon-blue);border-radius:8px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.upgrade-info{flex:1}
.upgrade-name{font-weight:bold;color:var(--neon-blue);margin-bottom:5px}
.upgrade-desc{font-size:12px;opacity:0.7}
.upgrade-level{background:var(--neon-purple);color:#fff;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:bold;margin-left:10px}
.scroll-container{max-height:400px;overflow-y:auto;padding:10px;width:100%}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(0,0,0,0.3);border-radius:6px;margin:8px 0}
.settings-label{font-weight:bold;color:var(--neon-blue)}
.settings-control{display:flex;align-items:center;gap:10px}
.settings-control select,.settings-control input[type="range"]{background:#1a1a2e;color:#fff;border:1px solid var(--neon-blue);border-radius:4px;padding:6px}
.settings-control input[type="range"]{width:150px}
.achievement-item{background:rgba(0,0,0,0.4);border-left:4px solid var(--neon-blue);padding:12px;margin:8px 0;border-radius:0 8px 8px 0;text-align:left}
.achievement-item.unlocked{border-left-color:var(--neon-green);background:rgba(0,255,100,0.1)}
.achievement-name{font-weight:bold;color:var(--neon-blue)}
.achievement-item.unlocked .achievement-name{color:var(--neon-green)}
.achievement-desc{font-size:12px;opacity:0.7;margin-top:4px}
.challenge-item{background:rgba(0,0,0,0.5);border:1px solid var(--neon-purple);border-radius:8px;padding:15px;margin:10px 0;text-align:left}
.challenge-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.challenge-name{font-weight:bold;color:var(--neon-yellow)}
.challenge-reward{color:var(--neon-green);font-weight:bold;font-size:14px}
.challenge-progress{font-size:13px;opacity:0.8;margin-bottom:8px}
.challenge-bar{height:6px;background:#1a1a2e;border-radius:3px;overflow:hidden}
.challenge-fill{height:100%;background:linear-gradient(90deg,var(--neon-green),var(--neon-blue));width:0%;transition:width 0.3s}
.race-results{background:linear-gradient(135deg,rgba(0,0,0,0.9),rgba(20,0,40,0.8));border:3px solid var(--neon-blue);border-radius:12px;padding:30px;text-align:center;box-shadow:0 0 50px rgba(0,243,255,0.5)}
.result-position{font-size:72px;font-weight:bold;margin:20px 0}
.result-position.first{color:var(--neon-yellow);text-shadow:0 0 30px var(--neon-yellow)}
.result-position.second{color:#c0c0c0}
.result-position.third{color:var(--neon-orange)}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:20px 0}
.result-stat{background:rgba(0,0,0,0.5);padding:15px;border-radius:8px;border:1px solid var(--neon-blue)}
.result-stat-label{font-size:12px;opacity:0.7;margin-bottom:5px}
.result-stat-value{font-size:20px;font-weight:bold;color:var(--neon-yellow)}
@media(max-width:768px){.mobile-controls{display:flex}h1{font-size:36px}.btn{padding:12px 20px;font-size:14px;min-width:160px}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-layer" class="ui-layer"></div>
<script>
const CONFIG={fps:60,colors:['#00f3ff','#ff00ff','#bc13fe','#0aff0a','#fefe00','#ff5500','#ffffff','#ff3333','#ff0055'],wheelTypes:['sport','racing','classic','neon','chrome'],tracks:{city:{name:'City Circuit',length:2000,laps:3,color:'#00f3ff',bg:'#0a0a1a',difficulty:1},highway:{name:'Highway Run',length:3000,laps:2,color:'#fefe00',bg:'#1a0a0a',difficulty:1.2},mountain:{name:'Mountain Pass',length:2500,laps:3,color:'#0aff0a',bg:'#0a1a0a',difficulty:1.5}}};
const CAR_DATA=[{id:'starter',name:'Neon Starter',price:0,class:'C',stats:{acc:60,top:120,hand:70,brake:65,boost:50},color:'#00f3ff',neon:'#ff00ff'},{id:'street',name:'Street Runner',price:3000,class:'C',stats:{acc:65,top:130,hand:68,brake:70,boost:55},color:'#ff0055',neon:'#0aff0a'},{id:'speedster',name:'Speedster',price:5000,class:'B',stats:{acc:75,top:150,hand:65,brake:70,boost:60},color:'#ff0055',neon:'#0aff0a'},{id:'drifter',name:'Drift King',price:8000,class:'B',stats:{acc:70,top:140,hand:85,brake:75,boost:65},color:'#bc13fe',neon:'#fefe00'},{id:'phantom',name:'Phantom',price:12000,class:'A',stats:{acc:85,top:170,hand:80,brake:75,boost:70},color:'#bc13fe',neon:'#fefe00'},{id:'inferno',name:'Inferno',price:25000,class:'S',stats:{acc:95,top:200,hand:85,brake:85,boost:80},color:'#ff5500',neon:'#00f3ff'},{id:'legend',name:'Neon Legend',price:50000,class:'LEGENDARY',stats:{acc:100,top:220,hand:95,brake:90,boost:95},color:'#ffffff',neon:'#ff00ff'}}];
const ACHIEVEMENTS=[{id:'first_win',name:'First Win',desc:"Win your first race",done:false},{id:'win_10',name:'Victory Streak',desc:"Win 10 races",done:false},{id:'win_50',name:'Champion',desc:"Win 50 races",done:false},{id:'win_100',name:'Legend',desc:"Win 100 races",done:false},{id:'millionaire',name:'Millionaire',desc:"Earn $1M",done:false},{id:'speed_demon',name:'Speed Demon',desc:"Reach 200 km/h",done:false},{id:'drift_master',name:'Drift Master',desc:"Drift 5000m",done:false},{id:'collector',name:'Collector',desc:"Own 5 cars",done:false}];
const CHALLENGES=[{id:'win_3',name:'Hat Trick',desc:"Win 3 races",progress:0,target:3,reward:500},{id:'no_crash',name:'Clean Racer',desc:"Finish 5 races clean",progress:0,target:5,reward:750},{id:'boost_10',name:'Boost Master',desc:"Use boost 10 times",progress:0,target:10,reward:300},{id:'drift_1000',name:'Drift King',desc:"Drift 1000m",progress:0,target:1000,reward:600}];
class NeonRush{constructor(){this.canvas=document.getElementById('gameCanvas');this.ctx=this.canvas.getContext('2d');this.uiLayer=document.getElementById('ui-layer');this.resize();window.addEventListener('resize',()=>this.resize());this.state='loading';this.lastTime=0;this.race=null;this.raceMode='classic';this.player=this.loadPlayer();this.setupInput();this.setupUI();this.checkDailyReward();this.state='menu';requestAnimationFrame((t)=>this.loop(t));this.updateUI()}
resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight}
loadPlayer(){const saved=localStorage.getItem('neonRushPlayer');if(saved)return JSON.parse(saved);return{level:1,xp:0,xpToNext:100,cash:1000,totalCash:1000,wins:0,races:0,bestTime:null,ownedCars:['starter'],selectedCar:'starter',carCustom:{paint:'#00f3ff',neon:'#ff00ff',wheels:'sport'},upgrades:{},achievements:JSON.parse(JSON.stringify(ACHIEVEMENTS)),challenges:JSON.parse(JSON.stringify(CHALLENGES)),lastDaily:null,settings:{gfx:'medium',musicVol:70,sfxVol:80,controls:'keyboard'},stats:{totalDrift:0,maxSpeed:0}}}
savePlayer(){localStorage.setItem('neonRushPlayer',JSON.stringify(this.player))}
checkDailyReward(){const today=new Date().toDateString();if(this.player.lastDaily!==today){this.player.cash+=200;this.player.xp+=50;this.player.lastDaily=today;this.savePlayer();setTimeout(()=>this.showNotification('🎁 Daily Reward: +$200, +50 XP!'),1000)}}
setupInput(){this.keys={};this.touch={left:false,right:false,brake:false,boost:false};window.addEventListener('keydown',(e)=>{this.keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Escape'&&this.state==='race')this.endRace(true)});window.addEventListener('keyup',(e)=>this.keys[e.code]=false);setTimeout(()=>{const btnLeft=document.getElementById('btnLeft');const btnRight=document.getElementById('btnRight');const btnBrake=document.getElementById('btnBrake');const btnBoost=document.getElementById('btnBoost');const addTouch=(elem,key)=>{elem.addEventListener('touchstart',(e)=>{e.preventDefault();this.touch[key]=true});elem.addEventListener('touchend',(e)=>{e.preventDefault();this.touch[key]=false})};addTouch(btnLeft,'left');addTouch(btnRight,'right');addTouch(btnBrake,'brake');addTouch(btnBoost,'boost')},100)}
getInput(){const k=this.keys,t=this.touch;return{left:k['ArrowLeft']||k['KeyA']||t.left,right:k['ArrowRight']||k['KeyD']||t.right,brake:k['ArrowDown']||k['KeyS']||t.brake,boost:k['Space']||t.boost}}
setupUI(){this.uiLayer.innerHTML=`<div id="menuScreen" class="screen active"><div class="screen-content"><h1>⚡ NEON RUSH</h1><button class="btn" onclick="game.showScreen('modeSelect')">▶️ PLAY</button><button class="btn" onclick="game.showScreen('garage')">🏎️ GARAGE</button><button class="btn" onclick="game.showScreen('shop')">🛒 SHOP</button><button class="btn" onclick="game.showScreen('upgrades')">🔧 UPGRADES</button><button class="btn" onclick="game.showScreen('profile')">👤 PROFILE</button><button class="btn" onclick="game.showScreen('challenges')">🎯 CHALLENGES</button><button class="btn" onclick="game.showScreen('achievements')">🏅 ACHIEVEMENTS</button><button class="btn btn-secondary" onclick="game.showScreen('settings')">⚙️ SETTINGS</button><div style="margin-top:20px;font-size:13px;opacity:0.6">v1.0 • Single File</div></div></div><div id="modeSelect" class="screen"><div class="screen-content"><h2>SELECT MODE</h2><button class="btn" onclick="game.startRace('classic')">🏆 CLASSIC</button><button class="btn" onclick="game.startRace('duel')">👤 1v1 DUEL</button><button class="btn btn-secondary" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="trackSelect" class="screen"><div class="screen-content"><h2>SELECT TRACK</h2><button class="btn" onclick="game.startRaceWithTrack('city')">🏙️ CITY</button><button class="btn" onclick="game.startRaceWithTrack('highway')">🌉 HIGHWAY</button><button class="btn" onclick="game.startRaceWithTrack('mountain')">🏔️ MOUNTAIN</button><button class="btn btn-secondary" onclick="game.showScreen('modeSelect')">← BACK</button></div></div><div id="garage" class="screen"><div class="screen-content"><h2>🏎️ GARAGE</h2><div id="garageCars" class="car-grid"></div><h3>🎨 CUSTOMIZE</h3><div>Paint:</div><div id="paintColors" class="color-picker"></div><div>Neon:</div><div id="neonColors" class="color-picker"></div><div>Wheels:<select id="wheelSelect" onchange="game.updateCarCustomization()" style="padding:8px;background:#222;color:#fff;border:1px solid var(--neon-blue);border-radius:4px;margin-top:8px"><option value="sport">Sport</option><option value="racing">Racing</option><option value="classic">Classic</option><option value="neon">Neon</option><option value="chrome">Chrome</option></select></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="shop" class="screen"><div class="screen-content"><h2>🛒 SHOP</h2><div style="font-size:18px;margin-bottom:15px;color:var(--neon-yellow)">💵 $<span id="shopCash">0</span></div><div id="shopCars" class="car-grid"></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="upgrades" class="screen"><div class="screen-content"><h2>🔧 UPGRADES</h2><div style="font-size:16px;margin-bottom:15px;color:var(--neon-yellow)">💵 $<span id="upgradeCash">0</span></div><div id="upgradesList" class="scroll-container"></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="profile" class="screen"><div class="screen-content"><h2>👤 PROFILE</h2><div class="stat-row"><span class="stat-label">Level:</span><span class="stat-value" id="profileLevel">1</span></div><div class="stat-row"><span class="stat-label">XP:</span><span class="stat-value" id="profileXP">0/100</span></div><div class="progress-bar"><div id="xpBar" class="progress-fill"></div></div><div class="stat-row"><span class="stat-label">Cash:</span><span class="stat-value">$<span id="profileCash">0</span></span></div><div class="stat-row"><span class="stat-label">Wins:</span><span class="stat-value" id="profileWins">0</span></div><div class="stat-row"><span class="stat-label">Races:</span><span class="stat-value" id="profileRaces">0</span></div><div class="stat-row"><span class="stat-label">Best:</span><span class="stat-value" id="profileBest">--:--</span></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="challenges" class="screen"><div class="screen-content"><h2>🎯 CHALLENGES</h2><div id="challengesList" class="scroll-container"></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="achievements" class="screen"><div class="screen-content"><h2>🏅 ACHIEVEMENTS</h2><div id="achievementsList" class="scroll-container"></div><button class="btn btn-secondary" style="margin-top:20px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="settings" class="screen"><div class="screen-content"><h2>⚙️ SETTINGS</h2><div class="settings-row"><span class="settings-label">Volume:</span><div class="settings-control"><input type="range" id="musicVol" min="0" max="100" value="70" onchange="game.updateSettings()"/><span id="musicVolValue">70%</span></div></div><div class="settings-row"><span class="settings-label">Controls:</span><div class="settings-control"><select id="controlType" onchange="game.updateSettings()"><option value="keyboard">Keyboard</option><option value="touch">Touch</option></select></div></div><button class="btn btn-danger" style="margin-top:20px" onclick="game.resetProgress()">🗑️ RESET</button><button class="btn btn-secondary" style="margin-top:10px" onclick="game.showScreen('menuScreen')">← BACK</button></div></div><div id="raceHud" class="hud-top"><div class="hud-element">⏱️<span id="raceTime">0:00.00</span></div><div class="hud-element">🏁Lap<span id="raceLap">1</span>/<span id="raceTotalLaps">3</span></div><div class="hud-element">💨<span id="boostBar">100</span>%</div><div class="hud-element">🥇<span id="racePos">1</span>/<span id="raceTotal">4</span></div></div><div class="mobile-controls"><div style="display:flex;gap:15px"><div class="mobile-btn" id="btnLeft">◀</div><div class="mobile-btn" id="btnRight">▶</div></div><div style="display:flex;gap:15px"><div class="mobile-btn" id="btnBrake">🛑</div><div class="mobile-btn" id="btnBoost">💨</div></div></div><div id="notification" class="notification">🎉</div>`}
showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');this.state=id;if(id==='garage')this.renderGarage();if(id==='shop')this.renderShop();if(id==='upgrades')this.renderUpgrades();if(id==='profile')this.renderProfile();if(id==='challenges')this.renderChallenges();if(id==='achievements')this.renderAchievements();if(id==='settings'){document.getElementById('musicVol').value=this.player.settings.musicVol;document.getElementById('controlType').value=this.player.settings.controls;document.getElementById('musicVolValue').textContent=this.player.settings.musicVol+'%'}}
updateUI(){document.getElementById('shopCash').textContent=this.player.cash.toLocaleString();document.getElementById('upgradeCash').textContent=this.player.cash.toLocaleString();document.getElementById('profileCash').textContent=this.player.cash.toLocaleString();document.getElementById('profileLevel').textContent=this.player.level;document.getElementById('profileXP').textContent=this.player.xp+'/'+this.player.xpToNext;document.getElementById('xpBar').style.width=(this.player.xp/this.player.xpToNext*100)+'%';document.getElementById('profileWins').textContent=this.player.wins;document.getElementById('profileRaces').textContent=this.player.races;document.getElementById('profileBest').textContent=this.player.bestTime?this.formatTime(this.player.bestTime):'--:--'}
formatTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),c=Math.floor((ms%1000)/10);return m+':'+(s%60).toString().padStart(2,'0')+'.'+c.toString().padStart(2,'0')}
showNotification(msg,dur=2000){const n=document.getElementById('notification');n.textContent=msg;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),dur)}
renderGarage(){document.getElementById('garageCars').innerHTML=CAR_DATA.map(c=>{const owned=this.player.ownedCars.includes(c.id),sel=this.player.selectedCar===c.id;return`<div class="car-card ${owned?'':'locked'} ${sel?'selected':''}" onclick="${owned?`game.selectCar('${c.id}')`:''}"><div class="car-name" style="color:${c.class==='LEGENDARY'?'var(--neon-yellow)':'#fff'}">${c.name}</div><div class="car-class">Class: ${c.class}</div><div class="car-stats">ACC:${c.stats.acc} TOP:${c.stats.top} HAN:${c.stats.hand}<br>BRK:${c.stats.brake} BST:${c.stats.boost}</div>${!owned?`<div class="car-price">$${c.price.toLocaleString()}</div>`:''}</div>`}).join('');const colors=CONFIG.colors;document.getElementById('paintColors').innerHTML=colors.map(c=>`<div class="color-swatch ${this.player.carCustom.paint===c?'selected':''}" style="background:${c}" onclick="game.setCarColor('paint','${c}')"></div>`).join('');document.getElementById('neonColors').innerHTML=colors.map(c=>`<div class="color-swatch ${this.player.carCustom.neon===c?'selected':''}" style="background:${c}" onclick="game.setCarColor('neon','${c}')"></div>`).join('');document.getElementById('wheelSelect').value=this.player.carCustom.wheels}
selectCar(id){this.player.selectedCar=id;this.savePlayer();this.renderGarage();this.showNotification('Car selected!')}
setCarColor(type,color){this.player.carCustom[type]=color;this.savePlayer();this.renderGarage()}
updateCarCustomization(){this.player.carCustom.wheels=document.getElementById('wheelSelect').value;this.savePlayer();this.showNotification('Saved!')}
renderShop(){this.updateUI();document.getElementById('shopCars').innerHTML=CAR_DATA.map(c=>{const owned=this.player.ownedCars.includes(c.id);return`<div class="car-card ${owned?'locked':''}" onclick="${!owned?`game.buyCar('${c.id}')`:''}"><div class="car-name">${c.name}</div><div class="car-class">Class: ${c.class}</div><div class="car-stats">ACC:${c.stats.acc} TOP:${c.stats.top} HAN:${c.stats.hand}<br>BRK:${c.stats.brake} BST:${c.stats.boost}</div>${owned?'<div class="car-price" style="color:var(--neon-green)">OWNED</div>':`<div class="car-price">$${c.price.toLocaleString()}</div>`}</div>`}).join('')}
buyCar(id){const c=CAR_DATA.find(x=>x.id===id);if(this.player.cash>=c.price){this.player.cash-=c.price;this.player.ownedCars.push(id);this.player.selectedCar=id;this.savePlayer();this.showNotification('🎉 Purchased '+c.name+'!');this.renderShop();if(this.player.ownedCars.length>=5&&!this.player.achievements.find(a=>a.id==='collector').done){this.player.achievements.find(a=>a.id==='collector').done=true;this.showNotification('🏆 Collector!',3000)}}else this.showNotification('❌ Not enough!')}
renderUpgrades(){this.updateUI();const cid=this.player.selectedCar,car=CAR_DATA.find(c=>c.id===cid);if(!this.player.upgrades[cid])this.player.upgrades[cid]={engine:0,turbo:0,brakes:0,tires:0,handling:0,nitro:0};const u=this.player.upgrades[cid];const defs=[{key:'engine',name:'Engine',desc:'Acceleration'},{key:'turbo',name:'Turbo',desc:'Top Speed'},{key:'brakes',name:'Brakes',desc:'Braking'},{key:'tires',name:'Tires',desc:'Grip'},{key:'handling',name:'Handling',desc:'Turning'},{key:'nitro',name:'Nitro',desc:'Boost'}];document.getElementById('upgradesList').innerHTML=defs.map(d=>{const lvl=u[d.key],cost=Math.floor(500*(lvl+1)*(car.class==='LEGENDARY'?2:1)),can=this.player.cash>=cost,maxed=lvl>=10;return`<div class="upgrade-item"><div class="upgrade-info"><div class="upgrade-name">${d.name} <span class="upgrade-level">Lv.${lvl}/10</span></div><div class="upgrade-desc">${d.desc}</div></div>${maxed?'<div style="color:var(--neon-green)">MAXED</div>':`<button class="btn btn-small ${can?'btn-success':'btn-secondary'}" onclick="game.buyUpgrade('${d.key}')" ${!can?'disabled':''}>$${cost.toLocaleString()}</button>`}</div>`}).join('')}
buyUpgrade(type){const cid=this.player.selectedCar,car=CAR_DATA.find(c=>c.id===cid);if(!this.player.upgrades[cid])this.player.upgrades[cid]={engine:0,turbo:0,brakes:0,tires:0,handling:0,nitro:0};const u=this.player.upgrades[cid],lvl=u[type],cost=Math.floor(500*(lvl+1)*(car.class==='LEGENDARY'?2:1));if(this.player.cash>=cost&&lvl<10){this.player.cash-=cost;u[type]++;this.savePlayer();this.showNotification(type.toUpperCase()+' Lv.'+u[type]+'!');this.renderUpgrades()}else this.showNotification('❌')}
renderProfile(){this.updateUI()}
renderChallenges(){document.getElementById('challengesList').innerHTML=this.player.challenges.map(c=>{const p=Math.min(c.progress,c.target),pct=p/c.target*100,done=p>=c.target;return`<div class="challenge-item"><div class="challenge-header"><div class="challenge-name">${c.name}</div><div class="challenge-reward">$${c.reward}</div></div><div class="challenge-progress">${c.desc} (${p}/${c.target})</div><div class="challenge-bar"><div class="challenge-fill" style="width:${pct}%;background:${done?'var(--neon-green)':'linear-gradient(90deg,var(--neon-green),var(--neon-blue))'}"></div></div></div>`}).join('')}
renderAchievements(){document.getElementById('achievementsList').innerHTML=this.player.achievements.map(a=>`<div class="achievement-item ${a.done?'unlocked':''}"><div class="achievement-name">${a.done?'✅':'⬜'} ${a.name}</div><div class="achievement-desc">${a.desc}</div></div>`).join('')}
updateSettings(){this.player.settings.musicVol=parseInt(document.getElementById('musicVol').value);this.player.settings.controls=document.getElementById('controlType').value;this.savePlayer();document.getElementById('musicVolValue').textContent=this.player.settings.musicVol+'%'}
resetProgress(){if(confirm('⚠️ Reset ALL progress?')){localStorage.removeItem('neonRushPlayer');this.player=this.loadPlayer();this.updateUI();this.showScreen('menuScreen');this.showNotification('Reset!')}}
startRace(mode){this.raceMode=mode;this.showScreen('trackSelect')}
startRaceWithTrack(tid){const track=CONFIG.tracks[tid],car=CAR_DATA.find(c=>c.id===this.player.selectedCar);this.race={track:track,car:car,mode:this.raceMode,startTime:Date.now(),lap:1,totalLaps:track.laps,distance:0,speed:0,boost:100,position:1,bots:[],crashed:false,finished:false,raceTime:0,bestLap:Infinity,currentLapTime:0,lastLapTime:0,particles:[],weather:Math.random()>0.7?'rain':'clear',timeOfDay:Math.random()>0.5?'day':'night',drift:0};const botCount=this.raceMode==='duel'?1:3;for(let i=0;i<botCount;i++){const bc=CAR_DATA[Math.floor(Math.random()*CAR_DATA.length)],diff=track.difficulty*(0.85+Math.random()*0.2);this.race.bots.push({car:bc,distance:0,speed:0,position:i+2,ai:{targetSpeed:bc.stats.top*diff,aggression:0.7+Math.random()*0.3,mistakeChance:0.001/diff}})}document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('raceHud').style.display='flex';document.getElementById('raceTotalLaps').textContent=this.race.totalLaps;document.getElementById('raceTotal').textContent=this.race.bots.length+1;this.state='race'}
endRace(quit=false){if(!this.race)return;document.getElementById('raceHud').style.display='none';if(!quit&&!this.race.finished){this.player.races++;this.savePlayer()}this.race=null;this.showScreen('menuScreen')}
updateRace(dt){const r=this.race;if(!r||r.finished)return;r.raceTime=Date.now()-r.startTime;r.currentLapTime=r.raceTime-(r.lap>1?r.lastLapTime:0);const car=r.car,input=this.getInput(),upg=this.player.upgrades[car.id]||{engine:0,turbo:0,brakes:0,tires:0,handling:0,nitro:0};const accB=1+upg.engine*0.05,topB=1+upg.turbo*0.03,brakeB=1+upg.brakes*0.05,handB=1+upg.handling*0.04,nitroB=1+upg.nitro*0.05;if(input.brake)r.speed+=car.stats.acc*0.05*dt*accB;else if(input.brake)r.speed-=car.stats.brake*0.08*dt*brakeB;else r.speed*=0.995;if(input.boost&&r.boost>0){r.speed+=car.stats.boost*0.03*dt*nitroB;r.boost-=0.5*dt;this.addParticle(r,'boost')}else if(!input.boost&&r.boost<100)r.boost+=0.2*dt;if(input.left){r.distance-=2*(r.speed/car.stats.top)*dt*handB;r.drift+=1*dt;this.player.stats.totalDrift+=1*dt;this.addParticle(r,'tire')}if(input.right){r.distance+=2*(r.speed/car.stats.top)*dt*handB;r.drift+=1*dt;this.player.stats.totalDrift+=1*dt;this.addParticle(r,'tire')}const maxSp=car.stats.top*topB*(input.boost&&r.boost>0?1.3:1);r.speed=Math.max(0,Math.min(r.speed,maxSp));if(r.speed>this.player.stats.maxSpeed){this.player.stats.maxSpeed=r.speed;if(r.speed>=200&&!this.player.achievements.find(a=>a.id==='speed_demon').done){this.player.achievements.find(a=>a.id==='speed_demon').done=true;this.showNotification('🏆 Speed Demon!',3000)}}r.distance+=r.speed*0.1*dt;const tLen=r.track.length;if(r.distance>=tLen*r.lap){if(r.lap<r.totalLaps){r.lap++;r.lastLapTime=r.raceTime;if(r.currentLapTime<r.bestLap)r.bestLap=r.currentLapTime}else{r.finished=true;this.finishRace();return}}r.bots.forEach(b=>{const t=b.ai.targetSpeed;if(b.speed<t)b.speed+=b.car.stats.acc*0.04*dt;else b.speed*=0.998;b.distance+=b.speed*0.1*dt;if(Math.random()<b.ai.mistakeChance*dt)b.speed*=0.5});const all=[r.distance,...r.bots.map(b=>b.distance)];all.sort((a,b)=>b-a);r.position=all.indexOf(r.distance)+1;document.getElementById('raceTime').textContent=this.formatTime(r.raceTime);document.getElementById('raceLap').textContent=r.lap;document.getElementById('boostBar').textContent=Math.floor(r.boost);document.getElementById('racePos').textContent=r.position;r.particles=r.particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;return p.life>0})}
addParticle(r,type){const x=r.distance%r.track.length;r.particles.push({x:x,y:type==='boost'?20:-20,vx:(Math.random()-0.5)*50,vy:type==='boost'?-100:50,life:0.5+Math.random()*0.5,color:type==='boost'?'#00f3ff':'#555',size:2+Math.random()*3})}
finishRace(){const r=this.race,pos=r.position,win=pos===1;baseR=500,winB=win?1000:0,mult=[1.5,1.2,1,0.8][Math.min(pos-1,3)],cash=Math.floor((baseR+winB)*mult),xp=win?100:50;this.player.cash+=cash;this.player.totalCash+=cash;this.player.xp+=xp;this.player.races++;if(win)this.player.wins++;if(win&&(!this.player.bestTime||r.raceTime<this.player.bestTime))this.player.bestTime=r.raceTime;while(this.player.xp>=this.player.xpToNext){this.player.xp-=this.player.xpToNext;this.player.level++;this.player.xpToNext=Math.floor(this.player.xpToNext*1.2);this.showNotification('🎉 LEVEL '+this.player.level+'!',3000)}this.player.challenges.forEach(c=>{if(c.id==='win_3'&&win)c.progress++;if(c.id==='no_crash'&&!r.crashed)c.progress++;if(c.id==='boost_10')c.progress+=Math.floor((100-r.boost)/10)});if(this.player.stats.totalDrift>=5000&&!this.player.achievements.find(a=>a.id==='drift_master').done){this.player.achievements.find(a=>a.id==='drift_master').done=true;this.showNotification('🏆 Drift Master!',3000)}if(this.player.totalCash>=1000000&&!this.player.achievements.find(a=>a.id==='millionaire').done){this.player.achievements.find(a=>a.id==='millionaire').done=true;this.showNotification('🏆 Millionaire!',3000)}if(win){if(!this.player.achievements.find(a=>a.id==='first_win').done){this.player.achievements.find(a=>a.id==='first_win').done=true;this.showNotification('🏆 First Win!',3000)}if(this.player.wins>=10&&!this.player.achievements.find(a=>a.id==='win_10').done){this.player.achievements.find(a=>a.id==='win_10').done=true;this.showNotification('🏆 Victory Streak!',3000)}if(this.player.wins>=50&&!this.player.achievements.find(a=>a.id==='win_50').done){this.player.achievements.find(a=>a.id==='win_50').done=true;this.showNotification('🏆 Champion!',3000)}}this.savePlayer();this.updateUI();setTimeout(()=>this.showResults(pos,cash,xp),500)}
showResults(pos,cash,xp){const cls=['first','second','third',''][Math.min(pos-1,3)],txt=['🥇 1st','🥈 2nd','🥉 3rd',pos+'th'][Math.min(pos-1,3)],html=`<div class="race-results"><h2 style="color:var(--neon-yellow)">🏁 FINISHED</h2><div class="result-position ${cls}">${txt}</div><div class="result-stats"><div class="result-stat"><div class="result-stat-label">Time</div><div class="result-stat-value">${this.formatTime(this.race.raceTime)}</div></div><div class="result-stat"><div class="result-stat-label">Best Lap</div><div class="result-stat-value">${this.formatTime(this.race.bestLap)}</div></div><div class="result-stat"><div class="result-stat-label">💵 Cash</div><div class="result-stat-value">$${cash.toLocaleString()}</div></div><div class="result-stat"><div class="result-stat-label">⭐ XP</div><div class="result-stat-value">+${xp}</div></div></div><button class="btn" onclick="document.getElementById('raceResults').remove();game.showScreen('menuScreen')">CONTINUE</button></div>`;const rs=document.createElement('div');rs.className='screen active';rs.id='raceResults';rs.innerHTML=html;document.getElementById('ui-layer').appendChild(rs)}
render(){const ctx=this.ctx,w=this.canvas.width,h=this.canvas.height;ctx.fillStyle=this.race?this.race.track.bg:CONFIG.tracks.city.bg;ctx.fillRect(0,0,w,h);if(this.state==='race'&&this.race)this.renderRace(ctx,w,h);else this.renderMenu(ctx,w,h)}
renderMenu(ctx,w,h){const t=Date.now()/1000;ctx.strokeStyle='rgba(0,243,255,0.08)';ctx.lineWidth=1;const gs=50,off=(t*30)%gs;for(let x=off-gs;x<w;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=off-gs;y<h;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=0;i<30;i++){const x=(i*137+t*20)%w,y=(i*89+Math.sin(t+i)*30)%h,a=0.3+Math.sin(t*2+i)*0.2;ctx.fillStyle=`rgba(0,243,255,${a})`;ctx.fillRect(x,y,2,2)}}
renderRace(ctx,w,h){const r=this.race,tr=r.track;const grad=ctx.createLinearGradient(0,0,0,h);if(r.timeOfDay==='day'){grad.addColorStop(0,'#1a1a3a');grad.addColorStop(0.5,'#0a0a2a');grad.addColorStop(1,'#0a0a1a')}else{grad.addColorStop(0,'#0a0a1a');grad.addColorStop(0.5,'#1a0a2a');grad.addColorStop(1,'#0a0a1a')}ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);if(r.weather==='rain'){ctx.strokeStyle='rgba(0,243,255,0.3)';ctx.lineWidth=1;for(let i=0;i<150;i++){const x=Math.random()*w,y=Math.random()*h;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+15);ctx.stroke()}}const tY=h*0.55,tH=h*0.35;ctx.fillStyle='#1a1a2e';ctx.fillRect(0,tY,w,tH);ctx.strokeStyle=tr.color;ctx.lineWidth=3;ctx.setLineDash([30,30]);ctx.lineDashOffset=-(r.distance*0.15)%60;ctx.beginPath();ctx.moveTo(0,tY+tH/2);ctx.lineTo(w,tY+tH/2);ctx.stroke();ctx.setLineDash([]);ctx.shadowBlur=25;ctx.shadowColor=tr.color;ctx.strokeStyle=tr.color;ctx.lineWidth=5;ctx.strokeRect(0,tY,w,tH);ctx.shadowBlur=0;const pX=w*0.5,pY=tY+tH/2;this.drawCar(ctx,pX,pY,r.car,r.speed,r.car.stats.top,true,r.drift);r.bots.forEach((b,i)=>{const rd=b.distance-r.distance,bX=pX+rd*(w/tr.length)*0.5,bY=tY+tH/2-70+i*50;this.drawCar(ctx,bX,bY,b.car,b.speed,b.car.stats.top,false,0)});r.particles.forEach(p=>{const sx=((p.x%tr.length)*(w/tr.length)+w*0.5)%w;ctx.fillStyle=p.color;ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(sx,p.y+tY+tH/2,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(r.speed>r.car.stats.top*0.85){ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;for(let i=0;i<15;i++){const x=Math.random()*w,y=tY+Math.random()*tH,l=30+Math.random()*50;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-l,y);ctx.stroke()}}ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='14px monospace';for(let i=0;i<=tr.length;i+=500){const mx=((i%tr.length)*(w/tr.length)+w*0.5)%w;ctx.fillText(i+'m',mx,tY-10)}}
drawCar(ctx,x,y,car,sp,maxSp,isPl,dr){const sc=0.9,w=70*sc,h=35*sc;ctx.save();ctx.translate(x,y);const ti=dr*0.05;ctx.rotate(Math.sin(ti)*0.05);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-w/2+6,-h/2+6,w,h);const bg=ctx.createLinearGradient(-w/2,-h/2,-w/2,h/2),pc=isPl?this.player.carCustom.paint:car.color;bg.addColorStop(0,pc);bg.addColorStop(1,this.darken(pc,40));ctx.fillStyle=bg;if(isPl){ctx.shadowBlur=20;ctx.shadowColor=this.player.carCustom.neon}else{ctx.shadowBlur=15;ctx.shadowColor=car.neon}ctx.fillRect(-w/2,-h/2,w,h);ctx.shadowBlur=0;ctx.fillStyle=isPl?this.player.carCustom.neon:car.neon;ctx.globalAlpha=0.6;ctx.fillRect(-w/2-3,-h/2-3,w+6,3);ctx.fillRect(-w/2-3,h/2,w+6,3);ctx.globalAlpha=1;ctx.fillStyle='#0a0a1a';ctx.fillRect(-w/4,-h/3,w/2,h/1.5);const wc=this.player.carCustom.wheels==='neon'?(isPl?this.player.carCustom.neon:car.neon):'#333';ctx.fillStyle=wc;const wW=10*sc,wH=14*sc;ctx.fillRect(-w/2-wW,-h/2-wH/2,wW,wH);ctx.fillRect(-w/2-wW,h/2-wH/2,wW,wH);ctx.fillRect(w/2,-h/2-wH/2,wW,wH);ctx.fillRect(w/2,h/2-wH/2,wW,wH);ctx.fillStyle='#ffffaa';ctx.shadowBlur=12;ctx.shadowColor='#ffffaa';ctx.fillRect(w/2-3,-h/3,5,7);ctx.fillRect(w/2-3,h/3-7,5,7);ctx.shadowBlur=0;ctx.fillStyle='#ff3333';ctx.shadowBlur=10;ctx.shadowColor='#ff3333';ctx.fillRect(-w/2-2,-h/3,3,6);ctx.fillRect(-w/2-2,h/3-6,3,6);ctx.shadowBlur=0;if(sp>maxSp*0.92){ctx.fillStyle=`rgba(255,100,0,${0.5+Math.random()*0.3})`;ctx.beginPath();ctx.moveTo(-w/2,0);ctx.lineTo(-w/2-25-Math.random()*15,-5+Math.random()*10);ctx.lineTo(-w/2-25-Math.random()*15,5+Math.random()*10);ctx.closePath();ctx.fill()}ctx.restore()}
darken(hex,pct){const n=parseInt(hex.replace('#',''),16),amt=Math.round(2.55*pct),R=Math.max((n>>16)-amt,0),G=Math.max((n>>8&255)-amt,0),B=Math.max((n&255)-amt,0);return'#'+(0x1000000+R*65536+G*256+B).toString(16).slice(1)}
loop(t){const dt=Math.min((t-this.lastTime)/1000,0.1);this.lastTime=t;if(this.state==='race')this.updateRace(dt*60);this.render();requestAnimationFrame(t=>this.loop(t))}}
let game;window.addEventListener('load',()=>{game=new NeonRush()});
</script>
